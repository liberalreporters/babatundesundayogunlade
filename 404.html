<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Babatunde S. Ogunlade</title>
  <meta name="description" content="The page you requested could not be found.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#031B12">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .not-found{min-height:calc(100vh - var(--header-height));display:flex;align-items:center}
    .not-found__code{font-family:var(--font-display);font-size:clamp(5rem,16vw,11rem);line-height:.9;color:var(--color-gold-400);margin-bottom:var(--space-6)}
    .not-found h1{font-size:var(--text-h3);margin-bottom:var(--space-4)}
    .not-found p{max-width:52ch;color:rgba(255,255,255,.75);margin-bottom:var(--space-8)}
    .not-found__actions{display:flex;flex-wrap:wrap;gap:var(--space-4)}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Babatunde S. Ogunlade home">
        <span class="brand-mark">BO</span>
        <span class="brand-copy">
          <span class="brand-name">Babatunde S. Ogunlade</span>
          <span class="brand-subtitle">Official Public Leadership Portal</span>
        </span>
      </a>
    </div>
  </header>

  <main class="section--green not-found">
    <div class="container">
      <p class="not-found__code" aria-hidden="true">404</p>
      <h1>This page doesn't exist</h1>
      <p>The link may be outdated or the address may have been typed incorrectly. Return to the homepage or go straight to the contact section.</p>
      <div class="not-found__actions">
        <a class="btn btn--gold" href="/">Go to homepage</a>
        <a class="btn btn--outline" href="/#contact">Contact the office</a>
      </div>
    </div>
  </main>
</body>
</html>
