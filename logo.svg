<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <!-- Background -->
  <rect width="1200" height="630" fill="#032317"/>
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#c29b40" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Left Side Badge Emblem -->
  <g transform="translate(100, 115)">
    <circle cx="200" cy="200" r="190" fill="#0a432e" stroke="#c29b40" stroke-width="10"/>
    <circle cx="200" cy="200" r="150" fill="#ffffff"/>
    <path d="M 200,100 L 200,210 M 160,210 Q 200,280 240,210 Z" stroke="#8b5a2b" stroke-width="10" fill="#c29b40"/>
    <text x="200" y="310" font-family="'Inter', sans-serif" font-weight="900" font-size="32" fill="#0a432e" text-anchor="middle">OYHA 2027</text>
  </g>

  <!-- Right Side Text Block -->
  <g transform="translate(540, 160)">
    <!-- APC Badge -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#c29b40"/>
    <text x="110" y="23" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#032317" text-anchor="middle" letter-spacing="2">APC CANDIDATE</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Inter', sans-serif" font-weight="800" font-size="24" fill="#c29b40" letter-spacing="3">HON. BABATUNDE SUNDAY</text>
    <text x="0" y="145" font-family="'Inter', sans-serif" font-weight="900" font-size="58" fill="#ffffff" letter-spacing="1">OGUNLADE</text>

    <!-- Subtitle -->
    <text x="0" y="200" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#a0aec0">Oyo State House of Assembly 2027</text>
    <text x="0" y="232" font-family="'Inter', sans-serif" font-weight="600" font-size="18" fill="#e2e8f0">Ibarapa East Constituency (Eruwa &amp; Lanlate)</text>

    <!-- Footer Tagline -->
    <line x1="0" y1="270" x2="560" y2="270" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="0" y="310" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#c29b40" letter-spacing="2">ACCOUNTABLE GOVERNANCE • EMPOWERED COMMUNITIES</text>
  </g>
</svg>
